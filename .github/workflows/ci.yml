name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun check

      - name: Build
        run: bun run build

      - name: Smoke test the published binary with Node
        run: |
          node dist/index.mjs --version
          node dist/index.mjs --help > /dev/null

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Lint workflows
        run: nix run nixpkgs#actionlint -- .github/workflows/*.yml
